<!-- ===== CSS NAVBAR ===== -->
<style>
    /* ===== NAVBAR BASE ===== */
    .navbar {
        display: flex; justify-content: space-between; align-items: center;
        padding: 16px 28px; background: rgba(255,255,255,0.85);
        backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
        border-radius: 60px;
        box-shadow: 0 10px 40px rgba(26, 77, 46, 0.15);
        border: 1px solid rgba(201,168,76,0.2);
        margin: 12px 0 30px; position: sticky; top: 12px; z-index: 99;
        transition: all 0.3s;
    }
    .navbar .logo {
        display: flex; align-items: center; gap: 12px;
        font-size: 1.5rem; font-weight: 800; color: #1a4d2e; text-decoration: none;
    }
    .navbar .logo i { color: #c9a84c; font-size: 2rem; }
    .navbar .logo span { color: #c9a84c; }

    .nav-links { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .nav-links a {
        text-decoration: none; color: #1a4d2e; font-weight: 600;
        padding: 8px 18px; border-radius: 40px; transition: 0.3s;
        font-size: 0.9rem; cursor: pointer;
    }
    .nav-links a:hover, .nav-links a.active { background: #1a4d2e; color: #e8d48b; }
    .nav-links .cta-nav { background: #c9a84c; color: #1a4d2e; font-weight: 700; }
    .nav-links .cta-nav:hover { background: #1a4d2e; color: #c9a84c; }

    .menu-toggle {
        display: none; font-size: 1.8rem; background: none; border: none;
        color: #1a4d2e; cursor: pointer; padding: 4px 12px;
    }

    /* ===== NAV DROPDOWN ===== */
    .nav-dropdown { position: relative; display: inline-block; }
    .nav-dropdown-toggle { display: inline-flex; align-items: center; gap: 4px; cursor: pointer; }

    /* Wrapper transparan → jembatan hover (fix bug kursor pindah ke submenu) */
    .nav-dropdown-menu {
        display: none;
        position: absolute;
        top: 100%;
        left: 0;
        padding-top: 10px;
        background: transparent;
        min-width: 260px;
        z-index: 100;
        animation: dropdownFade 0.25s ease;
    }
    .nav-dropdown-menu-inner {
        background: rgba(255, 255, 255, 0.98);
        backdrop-filter: blur(16px);
        border-radius: 14px;
        box-shadow: 0 12px 40px rgba(26, 77, 46, 0.2);
        border: 1px solid rgba(201, 168, 76, 0.25);
        padding: 8px;
    }
    .nav-dropdown:hover .nav-dropdown-menu,
    .nav-dropdown.open .nav-dropdown-menu { display: block; }

    .nav-dropdown-menu a {
        display: flex; align-items: center; gap: 10px;
        padding: 10px 14px; border-radius: 10px;
        color: #1a4d2e; text-decoration: none;
        font-weight: 600; font-size: 0.85rem; transition: 0.2s; white-space: nowrap;
    }
    .nav-dropdown-menu a:hover { background: #faf6ed; color: #800020; padding-left: 18px; }
    .nav-dropdown-menu a i { color: #c9a84c; width: 16px; text-align: center; font-size: 0.9rem; }

    @keyframes dropdownFade {
        from { opacity: 0; transform: translateY(-6px); }
        to { opacity: 1; transform: translateY(0); }
    }

    /* ===== MODAL KALENDER AKADEMIK ===== */
    .modal-overlay-kalender {
        display: none; position: fixed; top: 0; left: 0;
        width: 100%; height: 100%;
        background: rgba(0,0,0,0.6); backdrop-filter: blur(6px);
        z-index: 1000; justify-content: center; align-items: center; padding: 20px;
    }
    .modal-overlay-kalender.active { display: flex; }
    .modal-content-kalender {
        background: #ffffff;
        border-radius: 20px;
        max-width: 900px; width: 100%;
        max-height: 90vh; overflow-y: auto;
        padding: 40px 44px;
        box-shadow: 0 30px 80px rgba(0,0,0,0.4);
        border: 1px solid rgba(201,168,76,0.2);
        position: relative;
        text-align: center;
    }
    .modal-content-kalender::before {
        content: ''; position: absolute; top: 0; left: 0;
        width: 100%; height: 5px;
        background: linear-gradient(90deg, #1a4d2e, #c9a84c, #800020);
        border-radius: 20px 20px 0 0;
    }
    .modal-content-kalender .modal-close-kalender {
        position: sticky; top: 0; float: right;
        background: none; border: none;
        font-size: 2rem; color: #1a4d2e;
        cursor: pointer; padding: 0 8px; line-height: 1; z-index: 2;
    }
    .modal-content-kalender .modal-close-kalender:hover {
        color: #800020; transform: rotate(90deg);
    }
    .modal-content-kalender h2 {
        font-size: 1.8rem; color: #1a4d2e;
        margin-bottom: 6px; text-align: left;
        display: flex; align-items: center; gap: 12px;
    }
    .modal-content-kalender h2 i { color: #c9a84c; font-size: 1.6rem; }
    .modal-content-kalender .sub-title {
        color: #2d6a4f; font-size: 0.95rem; text-align: left;
        border-bottom: 2px solid rgba(201,168,76,0.2);
        padding-bottom: 16px; margin-bottom: 20px;
    }
    .modal-content-kalender .sub-title i { color: #c9a84c; margin-right: 6px; }

    .kalender-image-wrapper {
        margin-top: 10px;
        padding: 16px;
        background: linear-gradient(135deg, rgba(26,77,46,0.03), rgba(201,168,76,0.03));
        border-radius: 16px;
        border: 1px solid rgba(201,168,76,0.2);
        position: relative;
    }
    .kalender-image-wrapper::before {
        content: ''; position: absolute; top: 0; left: 0;
        width: 100%; height: 4px;
        background: linear-gradient(90deg, #1a4d2e, #c9a84c);
        border-radius: 16px 16px 0 0;
    }
    .kalender-image {
        max-width: 100%;
        max-height: 65vh;
        width: auto;
        border-radius: 12px;
        cursor: zoom-in;
        transition: 0.3s;
        box-shadow: 0 8px 30px rgba(26,77,46,0.15);
        border: 2px solid rgba(201,168,76,0.15);
        display: block;
        margin: 0 auto;
    }
    .kalender-image:hover {
        transform: scale(1.02);
        box-shadow: 0 12px 40px rgba(26,77,46,0.25);
        border-color: #c9a84c;
    }
    .kalender-hint {
        font-size: 0.85rem;
        color: #1a4d2e;
        margin-top: 14px;
        font-style: italic;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 16px;
        background: rgba(26,77,46,0.05);
        border-radius: 30px;
        border: 1px dashed rgba(26,77,46,0.3);
    }

    /* ===== ZOOM MODAL GAMBAR KALENDER ===== */
    .zoom-modal-kalender {
        display: none; position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.92);
        z-index: 2000; justify-content: center; align-items: center;
        padding: 20px; cursor: zoom-out;
        animation: fadeInZoom 0.3s ease;
    }
    .zoom-modal-kalender.active { display: flex; }
    @keyframes fadeInZoom {
        from { opacity: 0; } to { opacity: 1; }
    }
    .zoom-modal-kalender img {
        max-width: 95%; max-height: 95%;
        object-fit: contain; border-radius: 12px;
        box-shadow: 0 30px 80px rgba(0,0,0,0.5);
        animation: zoomPop 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    }
    @keyframes zoomPop {
        from { opacity: 0; transform: scale(0.85); }
        to { opacity: 1; transform: scale(1); }
    }
    .zoom-close-kalender {
        position: fixed; top: 20px; right: 24px;
        background: rgba(255,255,255,0.15); color: white;
        border: 1px solid rgba(255,255,255,0.3);
        width: 48px; height: 48px; border-radius: 50%;
        font-size: 1.8rem; cursor: pointer;
        display: flex; align-items: center; justify-content: center;
        transition: 0.3s; backdrop-filter: blur(8px);
    }
    .zoom-close-kalender:hover {
        background: #800020; border-color: #800020;
        transform: rotate(90deg);
    }

    /* ===== RESPONSIVE NAVBAR ===== */
    @media (max-width: 768px) {
        .menu-toggle { display: block; }
        .nav-links {
            display: none; flex-direction: column; width: 100%;
            padding: 16px 0 8px; gap: 6px;
            background: rgba(255,255,255,0.95);
            border-radius: 30px; margin-top: 12px;
        }
        .nav-links.open { display: flex; }
        .navbar { flex-wrap: wrap; padding: 12px 20px; }

        .nav-dropdown-menu {
            position: static; box-shadow: none; border: none;
            background: transparent; padding: 0;
            margin-left: 16px; display: none;
        }
        .nav-dropdown.open .nav-dropdown-menu { display: block; }
        .nav-dropdown-menu-inner {
            background: transparent; box-shadow: none;
            border: none; padding: 0; backdrop-filter: none;
        }
        .nav-dropdown-menu a { font-size: 0.8rem; padding: 6px 12px; }

        .modal-content-kalender { padding: 30px 20px; }
        .modal-content-kalender h2 { font-size: 1.3rem; }
        .kalender-image { max-height: 50vh; }
    }
    @media (max-width: 480px) {
        .navbar .logo { font-size: 1.1rem; }
        .navbar .logo i { font-size: 1.5rem; }
        .modal-content-kalender { padding: 24px 16px; }
        .modal-content-kalender h2 { font-size: 1.1rem; }
    }
</style>

<!-- ===== SCRIPT NAVBAR (self-init) ===== -->
<script>
(function() {
    "use strict";

    function initNavbar() {
        const toggle = document.getElementById('menuToggle');
        const navLinks = document.getElementById('navLinks');
        if (!toggle || !navLinks) return;

        // ===== Mobile menu toggle =====
        toggle.addEventListener('click', () => {
            navLinks.classList.toggle('open');
            const icon = toggle.querySelector('i');
            icon.className = navLinks.classList.contains('open') ? 'fas fa-times' : 'fas fa-bars';
        });

        // ===== Dropdown toggle (khusus mobile) =====
        document.querySelectorAll('.nav-dropdown-toggle').forEach(toggleBtn => {
            toggleBtn.addEventListener('click', (e) => {
                if (window.innerWidth <= 768) {
                    e.preventDefault();
                    const dropdown = toggleBtn.closest('.nav-dropdown');
                    dropdown.classList.toggle('open');
                }
            });
        });

        // ===== Tandai menu aktif =====
        const currentPage = window.location.pathname.split('/').pop() || 'index.html';
        document.querySelectorAll('.nav-links a').forEach(link => {
            const href = link.getAttribute('href');
            if (href && href !== '#' && href.endsWith(currentPage)) {
                link.classList.add('active');
            }
        });

        // ===== Tutup menu mobile saat link diklik =====
        document.querySelectorAll('.nav-links a').forEach(link => {
            link.addEventListener('click', () => {
                if (!link.classList.contains('nav-dropdown-toggle')) {
                    navLinks.classList.remove('open');
                    const icon = toggle.querySelector('i');
                    icon.className = 'fas fa-bars';
                }
            });
        });

        // ===== Trigger modal Tentang (jika ada di halaman) =====
        document.querySelectorAll('.tentang-link').forEach(l => {
            l.addEventListener('click', e => {
                e.preventDefault();
                // Panggil fungsi global openModal dari halaman (jika ada)
                if (typeof window.openModal === 'function') {
                    window.openModal('tentangModal');
                }
            });
        });

        // ===== KALENDER MODAL =====
        const kalenderModal = document.getElementById('kalenderModal');
        const kalenderClose = document.getElementById('kalenderModalClose');
        const kalenderImage = document.getElementById('kalenderImage');
        const kalenderZoomModal = document.getElementById('kalenderZoomModal');
        const kalenderZoomImage = document.getElementById('kalenderZoomImage');
        const kalenderZoomClose = document.getElementById('kalenderZoomClose');

        function openKalender() {
            if (kalenderModal) {
                kalenderModal.classList.add('active');
                document.body.style.overflow = 'hidden';
            }
        }
        function closeKalender() {
            if (kalenderModal) {
                kalenderModal.classList.remove('active');
                document.body.style.overflow = '';
            }
        }

        document.querySelectorAll('.kalender-link').forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                openKalender();
            });
        });

        if (kalenderClose) kalenderClose.addEventListener('click', closeKalender);
        if (kalenderModal) {
            kalenderModal.addEventListener('click', (e) => {
                if (e.target === kalenderModal) closeKalender();
            });
        }

        // ===== ZOOM GAMBAR KALENDER =====
        function openKalenderZoom() {
            if (!kalenderImage || !kalenderZoomModal) return;
            kalenderZoomImage.src = kalenderImage.src;
            kalenderZoomModal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }
        function closeKalenderZoom() {
            if (kalenderZoomModal) {
                kalenderZoomModal.classList.remove('active');
                document.body.style.overflow = '';
            }
        }

        if (kalenderImage) {
            kalenderImage.addEventListener('click', openKalenderZoom);
        }
        if (kalenderZoomClose) kalenderZoomClose.addEventListener('click', closeKalenderZoom);
        if (kalenderZoomModal) {
            kalenderZoomModal.addEventListener('click', (e) => {
                if (e.target === kalenderZoomModal || e.target === kalenderZoomImage) {
                    closeKalenderZoom();
                }
            });
        }

        // ===== ESC handler =====
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeKalender();
                closeKalenderZoom();
            }
        });

        console.log('✅ Navbar + Modal Kalender siap');
    }

    // DOM ready check
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initNavbar);
    } else {
        initNavbar();
    }
})();
</script>
